<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>YH 피킹 열기</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#111;color:#fff;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
.box{max-width:420px;width:100%;text-align:center}
h1{font-size:24px;margin:0 0 8px}
p{font-size:16px;line-height:1.5;color:#ddd;margin:0 0 20px}
label{display:block;background:#0b8a4a;color:#fff;font-size:22px;font-weight:800;padding:22px;border-radius:12px}
input{display:none}
#msg{margin-top:16px;font-size:16px;color:#ffd54f;min-height:24px}
</style></head><body><div class="box">
<h1>YH 피킹 열기</h1>
<p>카톡으로 받은 피킹 파일을 골라 주세요.<br>이 화면에서 열면 '라벨 비추기'가 실시간 카메라로 됩니다.<br>파일은 이 휴대폰 안에서만 열리고 어디에도 올라가지 않습니다.</p>
<label>피킹 파일 불러오기<input id="f" type="file" accept=".html,.htm,text/html"></label>
<div id="msg"></div>
</div>
<script type="text/plain" id="yhc-carry">
(function(){
 // 이전 피킹 체크 옮기기: 체크(표시용)만 다루고 수량·재고는 바꾸지 않는다.
 var P='ym_floor_source_pick_';
 var K;try{K=KEY;}catch(e){return;}
 if(typeof K!=='string'||K.indexOf(P)!==0)return;
 // 카드 머리 '가져올 수량 N족' 옆에 꺼내고 남는 재고(사이즈 줄 오른쪽 '창고 3'·'바닥카 1' 합계)를 붙인다. 없으면 안 보인다. 재고 계산은 하지 않고 파일에 적힌 숫자만 더한다.
 (function(){
  document.querySelectorAll('article[data-keys]').forEach(function(a){var t=a.querySelector('.model-total');if(!t||t.querySelector('.yhc-left'))return;var w=0,f=0;
   a.querySelectorAll('.work-row small').forEach(function(sm){var x=sm.textContent,m;var re=/(창고|바닥카)\s*(\d+)/g;while((m=re.exec(x)))if(m[1]==='창고')w+=+m[2];else f+=+m[2];});
   if(!w&&!f)return;var m=document.createElement('span');m.className='yhc-left';m.style.cssText='margin-left:6px;font-weight:900';
   m.textContent='/ 남은 '+(w&&f?'창고 '+w+' · 바닥카 '+f+'족':w?'창고 '+w+'족':'바닥카 '+f+'족');t.appendChild(m);});
 })();
 // 바닥카에서 꺼낼 칸은 기본 접어 두고, 머리 버튼을 누르면 펼친다(펼침 상태는 이 목록마다 기억).
 (function(){
  var FK='yhc_floor_open_'+K;function fget(){try{return localStorage.getItem(FK)!=='false';}catch(e){return true;}}function fset(v){try{localStorage.setItem(FK,v?'true':'false');}catch(e){}}
  document.querySelectorAll('section.source.floor').forEach(function(sec){
   var grid=sec.querySelector('.grid'),head=sec.querySelector('.source-head');if(!grid||!head)return;
   var h2=head.querySelector('h2'),title=h2?h2.textContent:'바닥카에서 꺼내기';
   var btn=document.createElement('button');btn.type='button';btn.style.cssText='display:block;width:100%;min-height:56px;margin:6px 0;padding:8px 12px;border:2px solid #087653;border-radius:10px;background:#fff;color:#087653;font-size:17px;font-weight:800;text-align:left';
   head.insertAdjacentElement('afterend',btn);
   function left(){var n=0;grid.querySelectorAll('.work-row[data-key]:not(.no-work)').forEach(function(r){if(!r.classList.contains('row-done')&&!(r.closest('article')||{classList:{contains:function(){return false;}}}).classList.contains('card-done'))n++;});return n;}
   var shown=null;function show(open){if(shown!==open){shown=open;if(open)grid.style.removeProperty('display');else grid.style.setProperty('display','none','important');}btn.textContent=(open?'▲ 접기 · ':'▼ 펼치기 · ')+title+' · 남은 '+left()+'줄';}
   var open=fget();show(open);
   btn.onclick=function(){open=!open;fset(open);show(open);};
   // 라벨 비추기·확인할 줄 이동으로 이 칸의 줄에 가야 하면 자동으로 펼친다.
   new MutationObserver(function(ms){if(open)return;for(var i=0;i<ms.length;i++){var t=ms[i].target;if(t.classList&&(t.classList.contains('yhcam-flash')||t.style.outline)){open=true;show(true);setTimeout(function(){t.scrollIntoView({block:'center'});},30);return;}}}).observe(grid,{subtree:true,attributes:true,attributeFilter:['class','style']});
   grid.addEventListener('click',function(){setTimeout(function(){show(open);},50);});
  });
 })();
 function get(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
 function put(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
 function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
 function qtyOf(row){var s=row.querySelector('span');var m=s&&s.textContent.match(/(\d+)\s*족/);return m?+m[1]:null;}
 // 이 파일의 줄(키 → 꺼낼 수량)을 기록해 둔다. 다음 파일과 비교할 때 쓴다.
 var rows={},rowEl={};
 document.querySelectorAll('.work-row[data-key]').forEach(function(r){if(r.classList.contains('no-work'))return;var k=r.dataset.key;rows[k]=qtyOf(r);rowEl[k]=r;});
 var snap=get('yhc_snap_'+K,null);
 // 파일 이름표(KEY) 안의 '품번|…|사이즈:주문:바닥카' 를 읽는다(기록이 없는 예전 파일용).
 function parseList(k){var m={},re=/(.+?):(-?[\d.]*):(-?[\d.]*)(?:\|\|(?=.)|$)/g,x,s=k.slice(P.length);while((x=re.exec(s)))m[x[1]]={order:x[2],scan:x[3]};return m;}
 // 바닥카 칸이 '주문분 꺼내기'(take)인지 '주문 외 꺼내기'(remove)인지: PC와 같은 계산(바닥카 주문분 합 ≤ 잔여 합이면 take).
 function modeOf(list){var f=0,r=0;Object.keys(list).forEach(function(i){var o=+list[i].order||0,c=+list[i].scan||0;f+=Math.min(o,c);r+=Math.max(0,c-o);});return f<=r?'take':'remove';}
 var MODE=document.querySelector('section.source.floor.remove')?'remove':document.querySelector('section.source.floor')?'take':modeOf(parseList(K));
 put('yhc_snap_'+K,{name:window.YHC_FILE||(snap&&snap.name)||'',at:(snap&&snap.at)||Date.now(),rows:rows,mode:MODE});
 // 바닥카의 나머지 절반(주문 외 꺼내기면 '그대로 둔 주문분', 주문분 꺼내기면 '남겨 둔 주문 외')을 펼쳐 볼 수 있게 보여 준다. 표시만 한다.
 (function(){
  var sec=document.querySelector('section.source.floor');var list=parseList(K),g={},tot=0;
  Object.keys(list).forEach(function(it){var o=+list[it].order||0,c=+list[it].scan||0,q=MODE==='remove'?Math.min(o,c):Math.max(0,c-o);if(q<=0)return;var a=it.split('|'),size=a[a.length-1],head=a[0]+(a[1]&&a[1]!=='-'?' '+a[1]:'')+(a.length>3&&a.slice(2,-1).join('|')?' / '+a.slice(2,-1).join('|'):'');(g[head]=g[head]||[]).push([size,q]);tot+=q;});
  if(!tot)return;
  var title=MODE==='remove'?'바닥카에 그대로 둔 주문분':'바닥카에 남겨 둔 주문 외 재고';
  var wrap=document.createElement('section');wrap.className='yhc-rest';wrap.style.cssText='margin:10px 0;border:2px solid #087653;border-radius:10px;background:#fff';
  var btn=document.createElement('button');btn.type='button';btn.style.cssText='display:block;width:100%;min-height:56px;padding:8px 12px;border:0;background:#f0faf5;color:#065f46;font-size:17px;font-weight:800;text-align:left;border-radius:8px';
  var body=document.createElement('div');body.style.cssText='display:none;padding:4px 12px 10px';
  body.innerHTML=Object.keys(g).sort().map(function(h){var r=g[h].sort(function(x,y){return parseFloat(x[0])-parseFloat(y[0]);});var n=r.reduce(function(s,x){return s+x[1];},0);return '<div style="padding:8px 0;border-bottom:1px solid #eaecf0"><div style="font-size:16px;font-weight:800;color:#101828">'+esc(h)+' <span style="color:#065f46">'+n+'족</span></div><div style="font-size:16px;color:#101828;font-variant-numeric:tabular-nums;margin-top:2px">'+r.map(function(x){return esc(x[0])+' <b>'+x[1]+'</b>';}).join(' · ')+'</div></div>';}).join('')+'<div style="padding-top:6px;color:#475467;font-size:13px">'+(MODE==='remove'?'꺼내지 않고 바닥카에 두는 주문분입니다. 체크할 것 없음.':'꺼내지 않고 바닥카에 남기는 주문 외 재고입니다. 체크할 것 없음.')+'</div>';
  var open=false;function show(){body.style.display=open?'block':'none';btn.textContent=(open?'▲ 접기 · ':'▼ 펼쳐 보기 · ')+title+' · '+tot+'족 · '+Object.keys(g).length+'모델';}
  btn.onclick=function(){open=!open;show();};show();
  wrap.appendChild(btn);wrap.appendChild(body);
  if(sec)sec.insertAdjacentElement('afterend',wrap);else{var t=document.querySelector('.top');(t&&t.parentNode?t.parentNode:document.body).insertBefore(wrap,t?t.nextSibling:document.body.firstChild);}
 })();
 function label(full,mode){var a=full.split('|');var type=a.shift();var size=a[a.length-1],design=a[0],color=a.length>=4&&a[1]&&a[1]!=='-'?a[1]:'',combo=a.length>=4?a.slice(2,-1).join('|'):'';return design+(color?' '+color:'')+(combo?' / '+combo:'')+' · '+size+(type==='warehouse'?' (창고)':type==='floor'?((mode||MODE)==='remove'?' (바닥카 주문 외)':' (바닥카 주문분)'):'');}
 var css=document.createElement('style');css.textContent='.yhc-box{margin:10px 0;padding:10px 12px;border:2px solid #101828;border-radius:10px;background:#fff;font-size:15px;line-height:1.45;color:#101828}.yhc-box h3{margin:0 0 6px;font-size:17px}.yhc-box button{min-height:44px;margin:4px 6px 4px 0;padding:0 14px;border:0;border-radius:8px;background:#0b8a4a;color:#fff;font-size:16px;font-weight:800}.yhc-box button.sub{background:#e4e7ec;color:#101828;font-weight:700}.yhc-box ul{margin:4px 0 8px;padding-left:18px}.yhc-box li{margin:2px 0}.yhc-box .g{font-weight:800;margin-top:6px}.yhc-warn-row{background:#fff4c2!important;outline:2px solid #e0a800}.yhc-x{}html body .work-row.yhc-w:not(.row-done){background:#fff1b8!important;box-shadow:inset 8px 0 0 #e0a800!important}html body .work-row.yhc-f:not(.row-done){background:#e0ecff!important;box-shadow:inset 8px 0 0 #2e6be6!important}html body .work-row.row-done,html body article.card-done .work-row{background:#dcf5e6!important;box-shadow:inset 8px 0 0 #12b76a!important}html body .work-row.row-done+.yhc-note,html body article.card-done .yhc-note{display:none!important}.yhc-note{grid-column:1/-1;margin:0 0 6px;padding:4px 8px;background:#fff4c2;color:#5c4a00;font-size:14px;font-weight:700;border-radius:6px}';
 document.head.appendChild(css);
 var top=document.querySelector('.top')||document.body.firstElementChild;
 var box=document.createElement('div');box.className='yhc-box';box.hidden=true;
 if(top&&top.parentNode)top.parentNode.insertBefore(box,top.nextSibling);else document.body.insertBefore(box,document.body.firstChild);
 var CK='yhc_carry_'+K;
 // 표시는 파일 CSS에 덮이지 않게 줄 자체에 직접 칠한다.
 function paintRow(r,cls){r.classList.add(cls);}
 function addNote(r,text,bg,fg){var nx=r.nextElementSibling;if(nx&&nx.classList.contains('yhc-note'))return;var n=document.createElement('div');n.className='yhc-note';n.textContent=text;n.style.cssText='margin:0 0 6px!important;padding:6px 10px!important;background:'+bg+'!important;color:'+fg+'!important;font-size:15px!important;font-weight:800!important;border-radius:6px!important;line-height:1.35!important';r.insertAdjacentElement('afterend',n);}
 var order=[],at=-1;
 function jump(k){var r=rowEl[k];if(!r)return;var q=document.getElementById('q');if(q&&q.value){q.value='';q.dispatchEvent(new Event('input'));}
  var card=r.closest('article');if(card&&getComputedStyle(card).display==='none')card.style.setProperty('display','block','important');
  r.scrollIntoView({block:'center',behavior:'smooth'});r.style.setProperty('outline','4px solid #d92d20','important');r.style.setProperty('outline-offset','2px','important');setTimeout(function(){r.style.removeProperty('outline');},2500);
  at=order.indexOf(k);upd();}
 var nextBtn=document.createElement('button');nextBtn.type='button';nextBtn.style.cssText='position:fixed;right:10px;bottom:92px;z-index:60;min-height:52px;padding:0 16px;border:0;border-radius:26px;background:#b54708;color:#fff;font-size:17px;font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.3);display:none';
 nextBtn.onclick=function(){if(!order.length)return;jump(order[(at+1)%order.length]);};
 document.body.appendChild(nextBtn);
 function upd(){if(!order.length){nextBtn.style.display='none';return;}nextBtn.style.display='block';nextBtn.textContent='확인할 줄 '+(at<0?order.length+'개':(at+1)+'/'+order.length)+' ▶';}
 function report(c){
  if(!c.v2){c={v2:1,from:c.from,checked:c.moved||0,back:[],more:{},fresh:[],rem:{},van:[]};}
  var tb=c.back.reduce(function(s,x){return s+x.q;},0);
  var h='<h3>어제 꺼낸 것 이어받음 · '+c.checked+'줄 체크</h3><div>빨강: 따로 빼 둘 것 '+tb+'족 · 노랑: 더 꺼낼 것 '+Object.keys(c.more).length+'줄 · 파랑: 새로 꺼낼 것 '+c.fresh.filter(function(k){return !done[k];}).length+'줄. 줄을 누르면 그 칸으로 갑니다.</div>';
  function list(title,arr,color,fold){if(!arr.length)return '';return '<div class="g" style="color:'+color+'">'+esc(title)+' '+arr.length+'줄</div><ul'+(fold?' data-fold="1"':'')+'>'+arr.slice(0,400).map(function(x){return x.k?'<li><a href="#" data-k="'+esc(x.k)+'" style="color:#101828;font-weight:700;text-decoration:underline">'+esc(x.t)+' →</a></li>':'<li style="font-weight:700">'+esc(x.t)+'</li>';}).join('')+(arr.length>400?'<li>… 외 '+(arr.length-400)+'줄</li>':'')+'</ul>';}
  h+=list('따로 빼 둘 재고 (어제 꺼냈는데 오늘 주문에 없거나 줄어듦)',c.back.map(function(x){return {t:label('x|'+x.it)+' · '+x.q+'족 빼 두기 · '+x.why,k:''};}),'#b42318');
  h+=list('더 꺼내야 함 (어제 꺼낸 것보다 오늘 주문이 많음)',Object.keys(c.more).map(function(k){return {t:label(k)+' · '+c.more[k],k:rowEl[k]?k:''};}),'#b54708');
  h+=list('바닥카 주문 외 꺼내기 · 어제와 달라 체크 안 함',Object.keys(c.rem||{}).map(function(k){return {t:label(k)+' · '+c.rem[k],k:rowEl[k]?k:''};}),'#b54708');
  h+=list('새로 꺼낼 것 (어제 안 꺼낸 것)',c.fresh.filter(function(k){return !done[k];}).map(function(k){return {t:label(k)+(rows[k]!=null?' '+rows[k]+'족':''),k:rowEl[k]?k:''};}),'#175cd3',1);
  h+=list('참고 · 어제 주문에 있었고 체크 안 했는데 오늘 주문에서 빠진 것',(c.van||[]).map(function(x){return {t:label('x|'+x.it)+' · 어제 주문 '+x.o+'족',k:''};}),'#6941c6',1);
  h+='<button type="button" class="sub" id="yhcFold">'+(c.fold===false?'긴 목록 접기':'파랑·참고 목록 펼치기')+'</button><button type="button" class="sub" id="yhcAgain">다른 목록에서 체크 더 가져오기</button>';
  box.innerHTML=h;box.hidden=false;
  if(c.fold!==false)box.querySelectorAll('ul[data-fold]').forEach(function(e){e.style.display='none';});
  box.querySelector('#yhcFold').onclick=function(){c.fold=c.fold===false;put(CK,c);report(c);};
  box.querySelector('#yhcAgain').onclick=function(){showPicker(true);};
  box.querySelectorAll('a[data-k]').forEach(function(a){a.onclick=function(ev){ev.preventDefault();jump(a.dataset.k);};});
  Object.keys(c.more).forEach(function(k){var r=rowEl[k];if(!r)return;paintRow(r,'yhc-w');addNote(r,'⚠ '+c.more[k],'#fff1b8','#7a4b00');});
  Object.keys(c.rem||{}).forEach(function(k){var r=rowEl[k];if(!r)return;paintRow(r,'yhc-w');addNote(r,'⚠ '+c.rem[k],'#fff1b8','#7a4b00');});
  c.fresh.forEach(function(k){var r=rowEl[k];if(!r)return;paintRow(r,'yhc-f');addNote(r,'새로 꺼낼 것','#e0ecff','#123f91');});
  var want={};Object.keys(c.more).concat(Object.keys(c.rem||{})).forEach(function(k){if(rowEl[k])want[k]=1;});c.fresh.forEach(function(k){if(rowEl[k]&&!done[k])want[k]=1;});
  order=[];document.querySelectorAll('.work-row[data-key]').forEach(function(r){if(want[r.dataset.key])order.push(r.dataset.key);});at=-1;upd();
 }
 // 체크를 누를 때마다 '마지막으로 작업한 시각'을 남긴다(옮길 목록을 고를 때 씀).
 document.addEventListener('click',function(e){if(e.target.closest&&e.target.closest('.size-btn,.complete-btn'))put('yhc_touch_'+K,Date.now());},true);
 // 체크가 있는 다른 피킹 목록(최근 작업 먼저). 기록은 지우지 않고, 옮기기는 체크를 '더하기'만 한다.
 function getCands(){var cands=[],i,k;for(i=0;i<localStorage.length;i++){k=localStorage.key(i);if(!k||k.indexOf(P)!==0||k===K)continue;var d=get(k,{});var n=Object.keys(d).filter(function(x){return d[x];}).length;if(!n)continue;var sn=get('yhc_snap_'+k,null);cands.push({key:k,n:n,name:sn&&sn.name||'',at:Math.max(+get('yhc_touch_'+k,0)||0,sn&&sn.at||0)});}
  cands.sort(function(a,b){return b.at-a.at||b.n-a.n;});return cands;}
 function candBtn(c,i){var first=Object.keys(get(c.key,{}))[0]||'';var when=c.at?new Date(c.at):null;var w=when?(when.getMonth()+1)+'.'+when.getDate()+' '+when.getHours()+':'+('0'+when.getMinutes()).slice(-2)+' 작업 · ':'시각 기록 없음 · ';return '<button type="button" data-i="'+i+'"'+(i?' style="background:#344054"':'')+'>'+esc(w+(c.name||(label(first)+' 등'))+' · 체크 '+c.n+'줄')+'</button>';}
 function showPicker(again){var cands=getCands();
  var n0=Object.keys(done||{}).filter(function(x){return done[x];}).length;
  var h='<h3>'+(again?'다른 목록에서 체크 더 가져오기':'이전 피킹 체크 옮기기')+'</h3><div>지금 이 목록 체크 '+n0+'줄은 그대로 두고, 고른 목록의 체크를 더합니다. 품번·색상·사이즈·수량이 같은 줄만 체크하고, 바뀐 줄은 노란색으로 표시만 합니다.</div>';
  if(!cands.length)h+='<div class="g">체크가 남아 있는 다른 목록이 없습니다.</div>';
  else{h+=candBtn(cands[0],0);if(cands.length>1)h+='<div class="g">다른 목록 (최근 작업 순)</div>'+cands.slice(1,15).map(function(c,j){return candBtn(c,j+1);}).join('');}
  h+='<button type="button" class="sub" id="yhcSkip">'+(again?'닫기':'옮기지 않음')+'</button>';
  box.innerHTML=h;box.hidden=false;
  box.querySelector('#yhcSkip').onclick=function(){if(again){var c=get(CK,null);if(c){report(c);return;}}put('yhc_skip_'+K,true);showSmall();};
  box.querySelectorAll('button[data-i]').forEach(function(b){b.onclick=function(){carry(cands[+b.dataset.i]);};});
 }
 function showSmall(){box.innerHTML='<button type="button" class="sub" id="yhcOpen">이전 목록 체크 가져오기</button>';box.hidden=false;box.querySelector('#yhcOpen').onclick=function(){showPicker(false);};}
 var carried=get(CK,null);
 if(carried){report(carried);}
 else if(getCands().length){if(get('yhc_skip_'+K,false))showSmall();else showPicker(false);}
 // 어제 꺼낸 것을 품번·색상·사이즈별 '꺼낸 족수'로 모아, 오늘 꺼낼 줄에 순서대로 채운다.
 // 남는 족수는 '따로 빼 둘 재고', 모자라면 '더 꺼내야 함'. 바닥카 '주문 외 꺼내기'(빼는 작업)는 따로 줄 단위로 맞춘다.
 function carry(c){
  var old=get(c.key,{}),os=get('yhc_snap_'+c.key,null),oldList=parseList(c.key),newList=parseList(K);
  var oldMode=os&&os.mode||modeOf(oldList);
  var it0=function(k){return k.slice(k.indexOf('|')+1);};
  function oldQty(k){if(os&&os.rows&&os.rows[k]!=null)return +os.rows[k]||0;var o=oldList[it0(k)];if(!o)return 0;var od=+o.order||0,sc=+o.scan||0;if(k.indexOf('warehouse|')===0)return Math.max(0,od-sc);return oldMode==='remove'?Math.max(0,sc-od):Math.min(od,sc);}
  var pulled={},remOld={};
  Object.keys(old).forEach(function(k){if(!old[k])return;if(k.indexOf('floor|')===0&&oldMode==='remove'){remOld[k]=oldQty(k);return;}var q=oldQty(k);if(q>0)pulled[it0(k)]=(pulled[it0(k)]||0)+q;});
  var res={v2:1,from:c.key,checked:0,back:[],more:{},fresh:[],rem:{},van:[],at:Date.now()};
  var need={};document.querySelectorAll('.work-row[data-key]').forEach(function(r){var k=r.dataset.key;if(!(k in rows))return;if(k.indexOf('floor|')===0&&MODE==='remove')return;(need[it0(k)]=need[it0(k)]||[]).push(k);});
  Object.keys(need).forEach(function(it){var P=pulled[it]||0,had=P>0;
   need[it].forEach(function(k){var q=+rows[k]||0;
    if(done[k]){P-=q;return;}
    if(P>=q&&q>0){done[k]=true;res.checked++;P-=q;}
    else if(P>0){res.more[k]='어제 꺼낸 것 '+P+'족 있음 · '+(q-P)+'족 더 꺼내기';P=0;}
    else res.fresh.push(k);
   });
   if(P>0){var tot=need[it].reduce(function(s,k){return s+(+rows[k]||0);},0);res.back.push({it:it,q:P,why:'오늘 '+tot+'족만 필요'});}
  });
  Object.keys(pulled).forEach(function(it){if(!need[it])res.back.push({it:it,q:pulled[it],why:'오늘 주문에 없음'});});
  // 바닥카 주문 외 꺼내기(빼는 작업): 같은 줄·같은 족수면 체크.
  Object.keys(remOld).forEach(function(k){if(MODE!=='remove'||!(k in rows)||done[k])return;if((+rows[k]||0)===remOld[k]){done[k]=true;res.checked++;}else res.rem[k]='어제 '+remOld[k]+'족 뺐음 · 오늘 '+rows[k]+'족 · 확인';});
  var chkIt={};Object.keys(old).forEach(function(k){if(old[k])chkIt[it0(k)]=1;});
  Object.keys(oldList).forEach(function(it){if((+oldList[it].order||0)>0&&!chkIt[it]&&!((newList[it]&&+newList[it].order)>0))res.van.push({it:it,o:oldList[it].order});});
  res.back.sort(function(a,b){return a.it<b.it?-1:1;});
  try{save();paint();}catch(e){}
  put('yhc_touch_'+K,Date.now());
  var prev=get(CK,null);if(prev&&prev.v2)res.checked+=prev.checked||0;
  put(CK,res);report(res);window.scrollTo(0,0);
 }
})();
</script>
<script>
document.getElementById('f').addEventListener('change',function(e){
 var file=e.target.files[0];if(!file)return;
 var msg=document.getElementById('msg');
 if(!/\.html?$/i.test(file.name)&&file.type!=='text/html'){msg.textContent='HTML 피킹 파일이 아닙니다: '+file.name;return;}
 msg.textContent='여는 중…';
 var r=new FileReader();
 r.onload=function(){
  var html=String(r.result);
  // 피킹 파일 안에 '이전 체크 옮기기'를 넣는다(파일 자체 기능은 그대로).
  var add='<script>window.YHC_FILE='+JSON.stringify(file.name).replace(/</g,'\\u003c')+';<\/script><script>'+document.getElementById('yhc-carry').textContent+'<\/script>';
  html=/<\/body>(?![\s\S]*<\/body>)/i.test(html)?html.replace(/<\/body>(?![\s\S]*<\/body>)/i,function(){return add+'</body>';}):html+add;
  // 파일 내용을 이 https 페이지에 그대로 펼친다. 같은 주소라 카메라 허락이 유지된다.
  history.pushState({yhOpened:1},'',location.pathname+'#'+encodeURIComponent(file.name));
  document.open();document.write(html);document.close();
 };
 r.onerror=function(){msg.textContent='파일을 읽지 못했습니다.';};
 r.readAsText(file,'utf-8');
});
</script></body></html>
